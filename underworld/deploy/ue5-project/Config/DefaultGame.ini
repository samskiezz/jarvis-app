[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Underworld Minions

[/Script/UnrealEd.ProjectPackagingSettings]
; Force-cook all Underworld gameplay assets + maps so the packaged stream has
; the Higgsfield/Tripo props, vehicles, characters and world pieces.
+DirectoriesToAlwaysCook=(Path="/Game/UnderworldAssets")
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
bCookAll=False
; Stage non-.uasset manifest files into the .pak so the C++ resolver can read them at runtime.
+DirectoriesToAlwaysStageAsUFS=(Path="UnderworldAssets")
