# Pixel Streaming reverse-proxy location for Hostinger VPS.
#
# The Vast GPU box maintains a persistent reverse SSH tunnel into Hostinger,
# forwarding Hostinger localhost:18081 to Vast localhost:8081 (the Caddy path proxy).
#
# Add this location block inside the existing nginx server{} block for
# app.projectsolar.cloud, then reload nginx:
#
#   sudo nginx -t && sudo systemctl reload nginx

location /jarvis/UnderworldUE5/ {
    proxy_pass http://127.0.0.1:18081/jarvis/UnderworldUE5/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}
